<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - BĐS Hưng Thịnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --luxury-gold: #c5a059;
            --luxury-gold-dark: #b08d46;
            --luxury-dark: #111827;
            --luxury-navy: #0f172a;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1920&q=80') center/cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .auth-card { 
            max-width: 450px; 
            width: 100%; 
            background: #ffffff; 
            border-top: 4px solid var(--luxury-gold);
            border-radius: 0px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            padding: 40px;
        }
        .auth-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--luxury-navy);
            text-align: center;
            margin-bottom: 25px;
        }
        .form-control {
            border-radius: 0;
            border: 1px solid #cbd5e1;
            padding: 12px;
        }
        .form-control:focus {
            border-color: var(--luxury-gold);
            box-shadow: 0 0 0 0.25rem rgba(197, 160, 89, 0.25);
        }
        .btn-luxury-primary {
            background-color: var(--luxury-gold); color: #ffffff; border: none;
            padding: 12px; font-weight: 600; letter-spacing: 1px;
            text-transform: uppercase; border-radius: 0px; transition: all 0.3s ease;
            width: 100%;
        }
        .btn-luxury-primary:hover { background-color: var(--luxury-gold-dark); color: #ffffff; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; }
        .auth-footer a { color: var(--luxury-gold); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-card">
    <h2 class="auth-title">✦ ĐĂNG KÝ</h2>
    <p class="text-center text-muted small mb-4">Trở thành hội viên để kết nối những cơ hội đầu tư đỉnh cao</p>
    
    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary small">Họ và tên</label>
            <input type="text" class="form-control" id="fullname" required placeholder="Nguyễn Văn A">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary small">Email</label>
            <input type="email" class="form-control" id="email" required placeholder="name@example.com">
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold text-secondary small">Mật khẩu</label>
            <input type="password" class="form-control" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-luxury-primary">Đăng Ký Tài Khoản</button>
    </form>
    
    <div class="auth-footer">
        <p class="mb-0">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
        <p class="mt-2"><a href="index.html" class="text-muted small">← Quay lại Trang Chủ</a></p>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const fullname = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        let users = JSON.parse(localStorage.getItem('users')) || [];
        
        const existingUser = users.find(u => u.email === email);
        if (existingUser) {
            alert('Email này đã được đăng ký!');
            return;
        }

        users.push({ fullname, email, password });
        localStorage.setItem('users', JSON.stringify(users));
        
        alert('Đăng ký tài khoản thành công!');
        window.location.href = 'login.html';
    });
</script>
</body>
</html>
