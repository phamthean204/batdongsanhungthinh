<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - BĐS Hưng Thịnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Thêm Google Fonts cao cấp -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* BẢNG MÀU & FONT CHỮ LUXURY */
        :root {
            --luxury-gold: #c5a059;
            --luxury-gold-dark: #b08d46;
            --luxury-dark: #111827;
            --luxury-navy: #0f172a;
            --bg-light: #f8fafc;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--luxury-navy); 
            height: 100vh;
            display: flex;
            align-items: center;
        }
        
        /* AUTH CARD LUXURY */
        .auth-card { 
            max-width: 440px; 
            width: 100%; 
            margin: auto; 
            background: #ffffff;
            border: none;
            border-top: 4px solid var(--luxury-gold);
            border-radius: 0px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
        }
        .auth-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--luxury-navy);
            letter-spacing: 0.5px;
        }
        
        .form-label { font-weight: 600; color: #475569; font-size: 0.95rem; }
        .form-control {
            border-radius: 0;
            border: 1px solid #cbd5e1;
            padding: 12px 15px;
        }
        .form-control:focus {
            border-color: var(--luxury-gold);
            box-shadow: 0 0 0 0.2rem rgba(197, 160, 89, 0.25);
        }
        
        /* BUTTON LUXURY */
        .btn-luxury-primary {
            background-color: var(--luxury-gold); color: #ffffff; border: none;
            padding: 12px 20px; font-weight: 600; letter-spacing: 1px;
            text-transform: uppercase; border-radius: 0px; transition: all 0.3s ease;
        }
        .btn-luxury-primary:hover { background-color: var(--luxury-gold-dark); color: #ffffff; }

        .btn-outline-secondary {
            border-radius: 0;
            border-color: #cbd5e1;
            color: #64748b;
        }
        .btn-outline-secondary:hover {
            background-color: #f1f5f9;
            color: var(--luxury-navy);
            border-color: #cbd5e1;
        }

        .error-message { color: #dc3545; font-size: 0.875em; margin-top: 0.25rem; display: none; }
        
        a { color: var(--luxury-gold-dark); text-decoration: none; font-weight: 600; }
        a:hover { color: var(--luxury-gold); text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="card auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <h3 class="auth-title mb-1">✦ BĐS HƯNG THỊNH</h3>
            <p class="text-muted small text-uppercase tracking-wider">Hệ Thống Quản Lý & Tra Cứu Kiệt Tác</p>
        </div>
        
        <div class="alert alert-danger rounded-0 border-0 fs-6 py-2" id="generalError" style="display: none;"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email tài khoản</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
                <div class="error-message" id="err-email">Vui lòng nhập định dạng email hợp lệ.</div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu của bạn">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="bi bi-eye-slash" id="eyeIcon"></i>
                    </button>
                </div>
                <div class="error-message" id="err-password">Vui lòng nhập mật khẩu.</div>
            </div>
            
            <button type="submit" class="btn btn-luxury-primary w-100 py-3 mb-3">Đăng Nhập</button>
            
            <div class="text-center text-muted">
                Chưa sở hữu tài khoản? <a href="register.html">Đăng ký ngay</a>
            </div>
        </form>
    </div>
</div>

<script>
    // --- TÍNH NĂNG ẨN/HIỆN MẬT KHẨU ---
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePassword.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        
        if (isPassword) {
            eyeIcon.classList.remove('bi-eye-slash');
            eyeIcon.classList.add('bi-eye');
        } else {
            eyeIcon.classList.remove('bi-eye');
            eyeIcon.classList.add('bi-eye-slash');
        }
    });

    // --- LOGIC ĐĂNG NHẬP ---
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Reset giao diện lỗi
        document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));
        const generalError = document.getElementById('generalError');
        generalError.style.display = 'none';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        let isValid = true;

        // Kiểm tra định dạng Email nhanh
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            document.getElementById('email').classList.add('is-invalid');
            document.getElementById('err-email').style.display = 'block';
            isValid = false;
        }

        // Kiểm tra mật khẩu rỗng
        if (password === '') {
            document.getElementById('password').classList.add('is-invalid');
            document.getElementById('err-password').style.display = 'block';
            isValid = false;
        }

        if (isValid) {
            // Lấy danh sách users từ hệ thống
            let users = JSON.parse(localStorage.getItem('users')) || [];

            // Đối chiếu dữ liệu
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                // Đăng nhập thành công
                localStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = 'index.html';
            } else {
                // Hiển thị lỗi tổng thể
                generalError.innerText = 'Email hoặc mật khẩu không chính xác. Vui lòng thử lại!';
                generalError.style.display = 'block';
                
                // Tô đỏ cả 2 ô
                document.getElementById('email').classList.add('is-invalid');
                document.getElementById('password').classList.add('is-invalid');
            }
        }
    });
</script>

</body>
</html>
