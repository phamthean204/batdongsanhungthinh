<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - BĐS Hưng Thịnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --luxury-gold: #c5a059;
            --luxury-gold-dark: #b08d46;
            --luxury-dark: #111827;
            --luxury-navy: #0f172a;
        }
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; color: #333333; }
        
        /* NAVBAR LUXURY */
        .navbar-luxury {
            background-color: var(--luxury-navy) !important;
            border-bottom: 2px solid var(--luxury-gold);
            padding: 15px 0;
        }
        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: var(--luxury-gold) !important;
            font-weight: 700;
        }
        .navbar-nav .nav-link { color: #e2e8f0 !important; font-weight: 500; margin-right: 15px; transition: color 0.3s ease; }
        .navbar-nav .nav-link:hover, .navbar-nav .nav-link.active { color: var(--luxury-gold) !important; }

        /* SECTION TITLE */
        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--luxury-navy);
        }

        /* CARD STYLE */
        .card { border: none; border-radius: 0px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .profile-card { border-top: 4px solid var(--luxury-gold); }
        .property-img { height: 110px; width: 100%; object-fit: cover; }

        /* BUTTONS */
        .btn-luxury-primary {
            background-color: var(--luxury-gold); color: #ffffff; border: none;
            padding: 10px 20px; font-weight: 600; letter-spacing: 1px;
            text-transform: uppercase; border-radius: 0px; transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .btn-luxury-primary:hover { background-color: var(--luxury-gold-dark); color: #ffffff; }
        .btn-outline-luxury {
            border: 1px solid var(--luxury-gold); color: var(--luxury-gold);
            background: transparent; border-radius: 0px; font-weight: 600; 
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease;
            font-size: 0.85rem;
        }
        .btn-outline-luxury:hover { background-color: var(--luxury-gold); color: #ffffff; }

        footer { background-color: var(--luxury-navy); color: #94a3b8; padding: 30px 0; border-top: 2px solid var(--luxury-gold); text-align: center; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-luxury sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">✦ BĐS HƯNG THỊNH</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Trang Chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="listings.html">Danh Sách Dự Án</a></li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link fw-bold active" href="user_dashboard.html" id="welcomeMessage" style="color: var(--luxury-gold) !important;"></a></li>
                <li class="nav-item"><a href="post_property.html" class="btn btn-luxury-primary btn-sm ms-3">✦ Đăng Tin</a></li>
                <li class="nav-item"><button class="btn btn-outline-danger btn-sm ms-2 rounded-0 px-3" onclick="logout()">Đăng Xuất</button></li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mt-5 mb-5">
    <div class="row">
        <!-- Thông tin cá nhân -->
        <div class="col-md-4 mb-4">
            <div class="card profile-card p-4 text-center">
                <img id="userAvatar" src="" class="rounded-circle mx-auto mb-3 shadow-sm" alt="Avatar" style="width: 100px; height: 100px; object-fit: cover; border: 3px solid var(--luxury-gold);">
                <h4 id="userName" class="section-title fs-3 mb-1">Loading...</h4>
                <p id="userEmail" class="text-muted small mb-3">Loading...</p>
                <hr class="text-muted opacity-25">
                <ul class="list-unstyled text-start small text-secondary mb-3">
                    <li class="mb-2">📅 <strong>Thành viên từ:</strong> <span class="text-dark">Hôm nay</span></li>
                    <li class="mb-2">🏷️ <strong>Loại tài khoản:</strong> <span class="text-dark">Hội viên VIP</span></li>
                    <li class="mb-2">📊 <strong>Tin đã đăng:</strong> <span id="postCount" class="text-dark fw-bold">0</span> tin</li>
                </ul>
                <a href="post_property.html" class="btn btn-luxury-primary w-100 py-2">+ Đăng Tin Mới</a>
            </div>
        </div>

        <!-- Quản lý tin đăng -->
        <div class="col-md-8">
            <div class="card p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <h3 class="section-title fs-3 m-0">Tin Đăng Của Bạn</h3>
                    <a href="post_property.html" class="btn btn-outline-luxury btn-sm">Thêm Mới</a>
                </div>

                <div id="myPropertiesContainer">
                    <!-- Danh sách tin đăng được load bằng JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="mt-5">
    <div class="container">
        <p class="mb-0">&copy; 2026 Bất Động Sản Hưng Thịnh Luxury. All Rights Reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) {
        alert('Vui lòng đăng nhập để truy cập trang cá nhân!');
        window.location.href = 'login.html';
    } else {
        document.getElementById('welcomeMessage').innerText = `👤 Xin chào, ${currentUser.fullname}!`;
        document.getElementById('userName').innerText = currentUser.fullname;
        document.getElementById('userEmail').innerText = currentUser.email;
        document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&background=0f172a&color=c5a059&size=100`;
    }

    function loadMyProperties() {
        const savedProperties = JSON.parse(localStorage.getItem('savedProperties')) || [];
        const container = document.getElementById('myPropertiesContainer');
        const myProps = savedProperties.filter(prop => prop.ownerEmail === currentUser.email);

        document.getElementById('postCount').innerText = myProps.length;

        if (myProps.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5 text-muted">
                    <p class="mb-3">Bạn chưa đăng bán hoặc cho thuê bất động sản nào.</p>
                    <a href="post_property.html" class="btn btn-luxury-primary btn-sm">Tạo tin đăng đầu tiên</a>
                </div>`;
            return;
        }

        container.innerHTML = myProps.map(prop => `
            <div class="card mb-3 border shadow-sm rounded-0">
                <div class="row g-0 align-items-center">
                    <div class="col-md-3">
                        <img src="${prop.img || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=400&q=80'}" class="img-fluid property-img" alt="${prop.title}">
                    </div>
                    <div class="col-md-7">
                        <div class="card-body py-2">
                            <h6 class="card-title text-truncate fw-bold mb-1" style="color: var(--luxury-navy); font-size: 1.1rem;" title="${prop.title}">${prop.title}</h6>
                            <p class="card-text text-danger fw-bold mb-1" style="font-family: 'Cormorant Garamond', serif; font-size: 1.15rem;">${Number(prop.price).toLocaleString('vi-VN')} VND</p>
                            <p class="card-text text-muted small mb-0">📍 ${prop.location || 'Đang cập nhật'}</p>
                        </div>
                    </div>
                    <div class="col-md-2 text-center">
                        <button class="btn btn-outline-danger btn-sm rounded-0 px-3" onclick="deleteProperty(${prop.id})">Xóa</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function deleteProperty(id) {
        if(confirm("Bạn có chắc chắn muốn xóa tin đăng này?")) {
            let savedProperties = JSON.parse(localStorage.getItem('savedProperties')) || [];
            savedProperties = savedProperties.filter(prop => prop.id !== id);
            localStorage.setItem('savedProperties', JSON.stringify(savedProperties));
            loadMyProperties();
        }
    }

    loadMyProperties();

    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
