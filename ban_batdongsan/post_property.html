<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Tin BĐS - BĐS Hưng Thịnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --luxury-gold: #c5a059;
            --luxury-gold-dark: #b08d46;
            --luxury-dark: #111827;
            --luxury-navy: #0f172a;
        }
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; color: #333333; }
        
        /* NAVBAR LUXURY */
        .navbar-luxury {
            background-color: var(--luxury-navy) !important;
            border-bottom: 2px solid var(--luxury-gold);
            padding: 15px 0;
        }
        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: var(--luxury-gold) !important;
            font-weight: 700;
        }
        .navbar-nav .nav-link { color: #e2e8f0 !important; font-weight: 500; margin-right: 15px; transition: color 0.3s ease; }
        .navbar-nav .nav-link:hover, .navbar-nav .nav-link.active { color: var(--luxury-gold) !important; }

        /* FORM CARD */
        .form-card { 
            max-width: 800px; 
            margin: 40px auto; 
            border: none; 
            border-radius: 0px; 
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-top: 4px solid var(--luxury-gold);
        }
        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--luxury-navy);
        }
        .form-control, .form-select {
            border-radius: 0;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--luxury-gold);
            box-shadow: 0 0 0 0.25rem rgba(197, 160, 89, 0.25);
        }
        .form-label { color: var(--luxury-navy); font-weight: 600; font-size: 0.9rem; }

        /* BUTTONS */
        .btn-luxury-primary {
            background-color: var(--luxury-gold); color: #ffffff; border: none;
            padding: 12px 30px; font-weight: 600; letter-spacing: 1px;
            text-transform: uppercase; border-radius: 0px; transition: all 0.3s ease;
        }
        .btn-luxury-primary:hover { background-color: var(--luxury-gold-dark); color: #ffffff; }

        footer { background-color: var(--luxury-navy); color: #94a3b8; padding: 30px 0; border-top: 2px solid var(--luxury-gold); text-align: center; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-luxury sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">✦ BĐS HƯNG THỊNH</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Trang Chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="listings.html">Danh Sách Dự Án</a></li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link fw-bold" href="user_dashboard.html" id="welcomeMessage" style="color: var(--luxury-gold) !important;"></a></li>
                <li class="nav-item"><a href="post_property.html" class="btn btn-luxury-primary btn-sm ms-3 active">✦ Đăng Tin</a></li>
                <li class="nav-item"><button class="btn btn-outline-danger btn-sm ms-2 rounded-0 px-3" onclick="logout()">Đăng Xuất</button></li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mb-5">
    <div class="card form-card p-4 p-md-5">
        <h3 class="section-title mb-4 border-bottom pb-3">📝 Đăng Tin Bất Động Sản Mới</h3>
        <form id="postPropertyForm">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Tiêu đề tin đăng <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" required placeholder="Ví dụ: Bán nhà mặt phố trung tâm...">
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label">Loại Bất Động Sản <span class="text-danger">*</span></label>
                    <select class="form-select" id="type" required>
                        <option value="apartment">Căn hộ chung cư</option>
                        <option value="villa">Biệt thự</option>
                        <option value="house">Nhà phố / Shophouse</option>
                        <option value="land">Đất nền / Đất vườn</option>
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label">Mức giá (VND) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="price" required placeholder="Ví dụ: 3500000000 (3.5 Tỷ)">
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">Địa chỉ chi tiết <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="location" required placeholder="Nhập địa chỉ bất động sản...">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Diện tích (m²) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="area" required placeholder="Ví dụ: 80">
                </div>
                
                <div class="col-md-4 mb-3">
                    <label class="form-label">Số phòng ngủ</label>
                    <input type="number" class="form-control" id="bedrooms" value="0" min="0">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Số phòng tắm</label>
                    <input type="number" class="form-control" id="bathrooms" value="0" min="0">
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">Đường dẫn hình ảnh (URL)</label>
                    <input type="url" class="form-control" id="imageUrl" placeholder="https://ví-dụ.com/hinh-anh.jpg (Bỏ trống dùng ảnh mặc định)">
                </div>

                <div class="col-md-12 mb-4">
                    <label class="form-label">Mô tả chi tiết <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="description" rows="5" required placeholder="Mô tả các tiện ích, pháp lý, vị trí xung quanh..."></textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-luxury-primary btn-lg w-100 fw-bold">ĐĂNG TIN NGAY</button>
        </form>
    </div>
</div>

<!-- FOOTER -->
<footer class="mt-5">
    <div class="container">
        <p class="mb-0">&copy; 2026 Bất Động Sản Hưng Thịnh Luxury. All Rights Reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) {
        alert('Vui lòng đăng nhập để đăng tin!');
        window.location.href = 'login.html';
    } else {
        document.getElementById('welcomeMessage').innerText = `👤 Xin chào, ${currentUser.fullname}!`;
    }

    document.getElementById('postPropertyForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const rawPrice = Number(document.getElementById('price').value);
        let calculatedPriceRange = "under3";
        if (rawPrice >= 3000000000 && rawPrice <= 5000000000) {
            calculatedPriceRange = "3to5";
        } else if (rawPrice > 5000000000) {
            calculatedPriceRange = "over5";
        }
        
        const newProperty = {
            id: Date.now(),
            ownerEmail: currentUser.email,
            title: document.getElementById('title').value,
            type: document.getElementById('type').value,
            price: rawPrice,
            priceRange: calculatedPriceRange,
            location: document.getElementById('location').value,
            area: document.getElementById('area').value + 'm2',
            bedrooms: document.getElementById('bedrooms').value,
            bathrooms: document.getElementById('bathrooms').value,
            img: document.getElementById('imageUrl').value || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80',
            desc: document.getElementById('description').value,
            datePosted: new Date().toLocaleDateString('vi-VN')
        };

        let savedProperties = JSON.parse(localStorage.getItem('savedProperties')) || [];
        savedProperties.push(newProperty);
        localStorage.setItem('savedProperties', JSON.stringify(savedProperties));

        alert('Đăng tin thành công!');
        window.location.href = 'user_dashboard.html';
    });

    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
